qlib_init:
    # Use the same cn_data directory as training. Daily prediction can still
    # restrict instruments below, so cn_data does not have to update every
    # market instrument before inference.
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn

experiment:
    # Local MLflow/Qlib recorder location. Relative paths are resolved from the
    # directory where scripts/daily_predict.py is executed.
    uri: "mlruns"
    name: "lightgbm_Alpha158_2026"
    recorder_id: "656273f29b6e46f191d4de56866e52f6"

data_update:
    # Optional hook for your own cn_data incremental update command.
    # This pool controls what your update command should update. It can differ
    # from prediction.instruments below.
    # Keep disabled when data has already been updated before this script runs.
    enabled: false
    cwd: "."
    instruments: all
    # instruments_file: "configs/update_universe.txt"
    command: []
    # Example:
    # command:
    #     - "python"
    #     - "scripts/your_update_cn_data.py"
    #     - "--provider-uri"
    #     - "{provider_uri}"
    #     - "--instruments"
    #     - "{data_update_instruments}"

prediction:
    date: latest
    freq: day
    # Default: predict all instruments available from cn_data.
    # Use instruments_file or an explicit list when you only want selected scores.
    instruments: all
    # instruments_file: "configs/predict_universe.txt"
    # instruments:
    #     - SH600000
    #     - SZ000001
    history_window: 0
    topk:
    output_dir: "predictions/lightgbm_Alpha158_2026"
    output_filename: "{date}.csv"
    overwrite: false
    write_manifest: true
