qlib_init:
    # 默认直接使用训练同一份 cn_data。
    # 每日预测仍可在 prediction.instruments 中限制标的池，
    # 因此推理前不强制要求全市场所有标的都完成当日更新。
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn

experiment:
    # 本地 MLflow/Qlib recorder 位置；相对路径按运行 daily_predict.py 时的当前目录解析。
    uri: "mlruns"
    name: "lightgbm_Alpha158_2026"
    recorder_id: "656273f29b6e46f191d4de56866e52f6"

data_update:
    # 在预测前更新 cn_data 日频行情。
    # source 可选 pool、akshare、baostock、yahoo。
    # pool 会把标的队列随机分配给 sources 中的多个源；失败或标准化为空的标的会回队列重试。
    # 如果某个源连续失败，会先冷却退避，多次冷却后本轮禁用。
    # 这里的 instruments 只控制更新命令要更新什么标的池，
    # 可以和下面 prediction.instruments 的预测标的池不同。
    enabled: true
    source: pool
    sources: "baostock,yahoo,akshare"
    end_date: today
    cwd: "."
    instruments: all
    work_dir: "~/.qlib/stock_data/cn_daily_update"
    max_workers: 6
    source_workers: "baostock=1,yahoo=3,akshare=2"
    delay: 0
    retry_count: 4
    source_consecutive_failures: 3
    source_cooldown: 10
    max_source_cooldown: 120
    source_min_attempts: 20
    source_error_rate: 0.8
    source_disable_after_cooldowns: 2
    # 更新标的也可以来自文件，例如一行一个股票代码。
    # instruments_file: "configs/update_universe.txt"
    # 命令会把占位符替换成当前配置值再执行。
    command:
        - "python"
        - "scripts/update_cn_data.py"
        - "--provider-uri"
        - "{provider_uri}"
        - "--source"
        - "{data_update_source}"
        - "--sources"
        - "{data_update_sources}"
        - "--instruments"
        - "{data_update_instruments}"
        - "--end-date"
        - "{data_update_end_date}"
        - "--work-dir"
        - "{data_update_work_dir}"
        - "--max-workers"
        - "{data_update_max_workers}"
        - "--source-workers"
        - "{data_update_source_workers}"
        - "--delay"
        - "{data_update_delay}"
        - "--retry-count"
        - "{data_update_retry_count}"
        - "--source-consecutive-failures"
        - "{data_update_source_consecutive_failures}"
        - "--source-cooldown"
        - "{data_update_source_cooldown}"
        - "--max-source-cooldown"
        - "{data_update_max_source_cooldown}"
        - "--source-min-attempts"
        - "{data_update_source_min_attempts}"
        - "--source-error-rate"
        - "{data_update_source_error_rate}"
        - "--source-disable-after-cooldowns"
        - "{data_update_source_disable_after_cooldowns}"

prediction:
    date: latest
    freq: day
    # 默认预测 cn_data 中可用的全标的。
    # 如果只想看部分标的，把 instruments 改成 csi300、自选列表，
    # 或启用 instruments_file。
    instruments: all
    # 预测标的也可以来自文件，例如一行一个股票代码。
    # instruments_file: "configs/predict_universe.txt"
    # instruments:
    #     - SH600000
    #     - SZ000001
    # 可选：标的中文名映射文件。cn_data 自带的 instruments 文件通常只有代码和日期，
    # 没有中文名称；配置后输出 CSV 的 instrument_name 列会按此文件填充。
    # 文件至少包含 instrument/code/证券代码 之一，以及 instrument_name/name/证券简称 之一。
    instrument_names_file: "configs/instrument_names.csv"
    history_window: 0
    topk:
    # 相对路径按运行脚本时的当前目录解析；在项目根目录运行时会输出到
    # /root/code/qlib/predictions/lightgbm_Alpha158_2026。
    output_dir: "predictions/lightgbm_Alpha158_2026"
    output_filename: "{date}.csv"
    overwrite: false
    write_manifest: true
