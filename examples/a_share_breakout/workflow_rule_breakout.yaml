# A 股日线突破阶段 4：无训练规则信号 + qrun 标准流水线。
# 可从仓库根目录运行：
#   python -m qlib.cli.run examples/a_share_breakout/workflow_rule_breakout.yaml
#
# 说明：
# - RuleSignalModel.fit 只校验列，不训练任何机器学习模型。
# - 交易信号只使用 T 日及以前可见字段；T+1 开盘仅作为回测成交价。
# - 本文件先落地 60 日突破版本；120 日版本可把 breakout_window 与 experiment_name 改为 120。

qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn

sys:
    rel_path: ["."]

experiment_name: a_share_breakout_rule_60d

market: &market all
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2021-01-01
    end_time: 2026-04-17
    fit_start_time: 2021-01-01
    fit_end_time: 2023-12-31
    instruments: *market
    breakout_window: 60
    benchmark_instrument: *benchmark
    # RuleSignalModel 内部会处理 NaN/inf，并且不训练参数。
    # 这里不做特征标准化和 label 处理，避免全市场日线面板被额外复制。
    infer_processors: []
    learn_processors: []

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 3
            hold_thresh: 20
            risk_degree: 0.95
            only_tradable: true
    backtest:
        start_time: 2025-01-02
        end_time: 2026-04-17
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: open
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: RuleSignalModel
        module_path: mylib.model
        kwargs:
            breakout_window: 60
            signal_mode: current
            active_window: 20
            hold_atr_buffer: 1.2
            hold_requires_ma: true
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: AShareBreakoutRuleHandler
                module_path: mylib.handler
                kwargs: *data_handler_config
            segments:
                train: [2021-01-01, 2023-12-31]
                valid: [2024-01-01, 2024-12-31]
                test: [2025-01-01, 2026-04-17]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: true
              ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
